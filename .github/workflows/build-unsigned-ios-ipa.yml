name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-unsigned-ios-ipa.yml
      - Vendors/Lean/repositories.bzl

permissions:
  contents: read

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build arm64 device IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          XCODE="/Applications/Xcode_26.6.app/Contents/Developer"
          if [[ ! -d "$XCODE" ]]; then
            echo "::error::Xcode 26.6 is not installed on this runner image."
            ls -1 /Applications | grep -E '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE"
          sudo xcodebuild -license accept
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bazelisk cmake coreutils
          git lfs install
          git lfs pull
          git lfs ls-files | head -40 || true

      - name: Prepare Bazel workspace
        shell: bash
        run: |
          set -euo pipefail
          ln -s WORKSPACE.darwin WORKSPACE
          printf '%s\\n' 'try-import %workspace%/.bazelrc.darwin' > .bazelrc
          test -f .bazelversion
          cat .bazelversion
          test -d Vendors

      - name: Build unsigned iPhone/iPad app
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 10240
          # rules_apple 4.2.0 still requires a profile artifact for device bundles
          # even when legacy signing is disabled. Supply a temporary empty placeholder;
          # it is removed from the IPA after packaging and is never used to sign the app.
          mkdir -p Apps/LocalCode/ProvisioningFiles
          : > Apps/LocalCode/ProvisioningFiles/LocalCode_Development.mobileprovision
          test -f Apps/LocalCode/ProvisioningFiles/LocalCode_Development.mobileprovision
          bazelisk --version
          bazelisk build --config=release --features=disable_legacy_signing --ios_multi_cpus=arm64 //Apps/LocalCode:LocalCode

      - name: Validate and stage unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          BAZEL_BIN="$(bazelisk info bazel-bin)"
          echo "Bazel output directory: $BAZEL_BIN"
          find "$BAZEL_BIN/Apps/LocalCode" -maxdepth 3 -type f -name '*.ipa' -print
          IPA="$(find "$BAZEL_BIN/Apps/LocalCode" -maxdepth 3 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA" || ! -f "$IPA" ]]; then
            echo "::error::Bazel completed but no IPA was found under bazel-bin/Apps/LocalCode."
            exit 1
          fi

          mkdir -p dist ipa-check
          ditto -x -k "$IPA" ipa-check

          APP="$(find ipa-check/Payload -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP" || ! -f "$APP/Info.plist" ]]; then
            echo "::error::IPA does not contain a valid Payload/*.app/Info.plist."
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if [[ "$BUNDLE_ID" != "com.liuliu.local-code" ]]; then
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi
          if [[ ! -f "$APP/$EXECUTABLE" ]]; then
            echo "::error::App executable is missing: $EXECUTABLE"
            exit 1
          fi

          ARCHS="$(lipo -archs "$APP/$EXECUTABLE")"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE"
          echo "Architectures: $ARCHS"
          if [[ " $ARCHS " != *" arm64 "* ]]; then
            echo "::error::The app executable does not contain arm64."
            exit 1
          fi

          # Remove the temporary placeholder profile before producing the deliverable.
          find "$APP" -name embedded.mobileprovision -type f -delete
          if find "$APP" -name embedded.mobileprovision -print -quit | grep -q .; then
            echo "::error::A provisioning profile remains embedded in the staged app."
            exit 1
          fi

          # Repack the app bundle after stripping the temporary profile.
          rm -f dist/LocalCode-unsigned-arm64.ipa
          (cd ipa-check && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/LocalCode-unsigned-arm64.ipa" .)

          # Re-open the final IPA and verify its actual contents, not just the source bundle.
          rm -rf ipa-final
          mkdir -p ipa-final
          ditto -x -k dist/LocalCode-unsigned-arm64.ipa ipa-final
          FINAL_APP="$(find ipa-final/Payload -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$FINAL_APP" || ! -f "$FINAL_APP/Info.plist" ]]; then
            echo "::error::Final IPA failed the Payload app validation."
            exit 1
          fi
          FINAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$FINAL_APP/Info.plist")"
          FINAL_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FINAL_APP/Info.plist")"
          FINAL_ARCHS="$(lipo -archs "$FINAL_APP/$FINAL_EXECUTABLE")"
          [[ "$FINAL_BUNDLE_ID" == "com.liuliu.local-code" ]]
          [[ " $FINAL_ARCHS " == *" arm64 "* ]]
          if find "$FINAL_APP" -name embedded.mobileprovision -print -quit | grep -q .; then
            echo "::error::The final IPA unexpectedly contains a provisioning profile."
            exit 1
          fi

          echo "Unsigned IPA validated: device arm64, correct bundle ID, no embedded provisioning profile."
          ls -lh dist/LocalCode-unsigned-arm64.ipa
          shasum -a 256 dist/LocalCode-unsigned-arm64.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalCode-unsigned-arm64-IPA
          path: dist/LocalCode-unsigned-arm64.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
